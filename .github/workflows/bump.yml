name: Bump locks & upstream watch

# 自动 Bump CI（WP-9；TDD §4.2「Bump 机制」/ §4.3「升级工作流」）：
#   - 定时（每周一 03:00 UTC）+ 手动触发；
#   - 检查三处锁定是否有上游更新：ImmortalWrt 基座（config/base.env）、
#     quartz / thirdparty feed（config/feeds.conf.extra 的 ^SHA）；
#   - 有更新 → 改锁定 → 推 bump/ 分支 → 开 PR（正文含验证检查单）；
#   - 另跑「上游发版观察」（thirdparty 受控 Fork 的上游仓库最新 tag/提交，只报告不动作）；
#   - 另跑「基座 feed 漂移周报」（2026-10-16 拍板：基座自带 feeds 保持分支追踪、不加
#     SHA 锁——漂移以「最近 Release 的 feeds.buildinfo」为基准报告；只报告不动作，
#     有漂移时维护一个跟踪 issue，漂移被新发布吸收后自动关闭）。
#
# 与构建策略的关系（2026-10-12 用户拍板）：本工作流**只做轻量检查与开 PR**，
# 不触发全量构建——合并前由维护者手动跑 `gh workflow run build.yml` 或本地
# build-local.sh 做权威验收（TDD §7.1）。
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只检查与报告：不推分支、不开 PR、不建/改 issue（验证工作流用）"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Check locked refs vs upstream
        id: check
        run: |
          set -euo pipefail
          changed=0
          body=""

          # ① 基座（config/base.env）
          . config/base.env
          base_new="$(git ls-remote "https://github.com/${BASE_OWNER_REPO}.git" "refs/heads/${BASE_BRANCH}" | cut -f1)"
          echo "base: locked=${BASE_COMMIT:0:12} upstream=${base_new:0:12}"
          if [ -n "$base_new" ] && [ "$base_new" != "$BASE_COMMIT" ]; then
            sed -i "s/^BASE_COMMIT=.*/BASE_COMMIT=$base_new/" config/base.env
            body="${body}- 基座 \`${BASE_OWNER_REPO}@${BASE_BRANCH}\`：\`${BASE_COMMIT:0:12}\` → \`${base_new:0:12}\`（**需重验设备补丁**：docs/TDD.md §4.6）"$'\n'
            changed=1
          fi

          # ② 双 Feed（config/feeds.conf.extra，行尾 ^SHA）
          for feed in quartz thirdparty; do
            url="$(sed -n "s|^src-git $feed \([^ ^]*\)\^.*|\1|p" config/feeds.conf.extra)"
            old="$(sed -n "s|^src-git $feed [^ ^]*\^\([0-9a-f]*\)$|\1|p" config/feeds.conf.extra)"
            [ -n "$url" ] && [ -n "$old" ] || { echo "FAIL: 无法解析 $feed 锁定行"; exit 1; }
            new="$(git ls-remote "$url" refs/heads/main | cut -f1)"
            echo "$feed: locked=${old:0:12} upstream=${new:0:12}"
            if [ -n "$new" ] && [ "$new" != "$old" ]; then
              sed -i "s|^src-git $feed \([^ ^]*\)\^[0-9a-f]*$|src-git $feed \1^$new|" config/feeds.conf.extra
              body="${body}- \`$feed\`：\`${old:0:12}\` → \`${new:0:12}\`（\`$url\`）"$'\n'
              changed=1
            fi
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            printf '%s' "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create bump PR
        if: steps.check.outputs.changed == '1' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="bump/locks-$(date -u +%Y%m%d)"
          git config user.name "quartzwrt-bump[bot]"
          git config user.email "bump@users.noreply.github.com"
          git checkout -b "$branch"
          git add config/base.env config/feeds.conf.extra
          git commit -m "WP-1/WP-7: 锁定 bump（自动检查）——$(date -u +%F)"
          git push -u origin "$branch" --force

          # 注意：heredoc 用**引号定界符**——body 含 markdown 反引号，未加引号会被
          # shell 当命令替换执行（首次运行实测踩中：`thirdparty: command not found`）。
          # Actions 表达式由引擎在交给 shell 前替换，引号定界符不影响它。
          cat > /tmp/pr-body.md <<'EOF'
          定时锁定检查发现上游更新：

          ${{ steps.check.outputs.body }}
          **合并前验证检查单（TDD §4.3）**：
          - [ ] 单包编译（涉及包：`make package/feeds/<feed>/<pkg>/{clean,compile}`）
          - [ ] 本地全量 `scripts/build-local.sh` 通过（含同名包检查 / manifest 断言 / 签名校验）
          - [ ] 设备构建（若基座 bump）：`--device erya_fnet-3399` 补丁重验 + 镜像核验
          - [ ] 需要时手动 CI 权威验收：`gh workflow run build.yml`
          - [ ] thirdparty 涉及镜像/fork：按 `QuartzWrt-ThirdParty/docs/FORKS.md` 发布前检查单同步并复验

          由 `.github/workflows/bump.yml` 自动生成（仅改锁定，不做任何构建）。
          EOF

          gh pr create --title "锁定 bump：$(date -u +%F) 上游更新" \
            --body-file /tmp/pr-body.md --base main --head "$branch" \
            || echo "PR 已存在或创建失败（分支已推送，可手动开 PR）"

      - name: Dry run（只打印拟开 PR 内容，不推分支、不开 PR）
        if: steps.check.outputs.changed == '1' && inputs.dry_run == true
        env:
          # 经 env 中转：正文含 markdown 反引号，直接内联进脚本会被 shell 当命令替换
          BODY: ${{ steps.check.outputs.body }}
        run: |
          echo "dry_run：跳过推分支与开 PR。拟开 PR 正文如下——"
          printf '%s\n' "$BODY"
          printf '%s\n' "$BODY" >> "$GITHUB_STEP_SUMMARY"

      - name: No updates
        if: steps.check.outputs.changed != '1'
        run: echo "所有锁定均为上游最新——无需 bump。"

  upstream-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Watch upstreams of controlled forks (informational)
        run: |
          set -uo pipefail
          echo "== 受控 Fork 上游观察（只报告，不动作；台账 QuartzWrt-ThirdParty/docs/FORKS.md） =="
          # 从 FORKS.md 提取所有 github.com 仓库 URL（上游 + fork），逐个报最新 tag 与默认分支头
          repos="$(grep -oE 'https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' \
                    QuartzWrt-ThirdParty/docs/FORKS.md 2>/dev/null | sort -u || true)"
          if [ -z "$repos" ]; then
            # Builder 单独检出时 FORKS.md 不在本仓库——按已知清单兜底
            repos="$(printf '%s\n' \
              https://github.com/FUjr/QModem \
              https://github.com/timsaya/openwrt-bandix \
              https://github.com/timsaya/luci-app-bandix \
              https://github.com/sbwml/luci-app-mosdns)"
          fi
          {
            echo "### 上游发版观察"
            echo ""
            echo "| 仓库 | 最新 tag | 默认分支头 | 日期 |"
            echo "| :--- | :--- | :--- | :--- |"
            for r in $repos; do
              tag="$(git ls-remote --tags --sort=-v:refname "$r" 2>/dev/null | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')"
              head_sha="$(git ls-remote "$r" HEAD 2>/dev/null | cut -f1)"
              date="$(git ls-remote --tags --sort=-creatordate "$r" 2>/dev/null | grep -v '\^{}' | head -1 | awk '{print $1}' | cut -c1-7 || true)"
              echo "| [$r]($r) | ${tag:-?} | ${head_sha:0:10} | ${date:-?} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "（对照 FORKS.md 的锁定/上次同步日期判断是否需要同步；有适配改动时先 rebase quartz 分支再复验。）"

  # 基座 feed 漂移周报（2026-10-16 拍板：基座自带 feeds 保持分支追踪、不加 SHA 锁）。
  # 基准 = 最近一次 Release 随资产发布的 feeds.buildinfo（构建产出，记录当次解析到的
  # 七条 feed 精确 SHA）；对照基座五条 feed 的分支当前头，报告距上次发布漂移了多少。
  # 只报告不动作：有漂移 → 创建/更新一个跟踪 issue（同一 issue 反复更新，不逐周新建）；
  # 漂移被新发布吸收（全为 0）→ 自动关闭。复现/二分时用记录里的 SHA 临时钉住对应 feed。
  base-feeds-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Report base feeds drift vs last release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          TITLE="基座 feed 漂移跟踪（自动周报）"
          echo "== 基座 feed 漂移报告（基准：最近 Release 的 feeds.buildinfo） =="

          tag="$(gh release view --json tagName --jq .tagName 2>/dev/null)"
          if [ -z "${tag:-}" ]; then
            echo "warn: 仓库还没有 Release（无基准）——跳过。"
            exit 0
          fi
          rm -rf /tmp/rel && mkdir -p /tmp/rel
          if ! gh release download "$tag" --pattern feeds.buildinfo --dir /tmp/rel --clobber 2>/dev/null; then
            echo "warn: Release $tag 没有 feeds.buildinfo 资产（无基准）——跳过。"
            exit 0
          fi
          echo "基准：Release $tag"

          . config/base.env  # 基座五条 feed 均跟随基座分支（与 feeds.conf.default 同款）
          drifted=0
          rows=""
          for feed in packages luci routing telephony video; do
            url="$(sed -n "s|^src-git $feed \([^ ]*\)\^.*|\1|p" /tmp/rel/feeds.buildinfo | head -1)"
            sha="$(sed -n "s|^src-git $feed [^ ]*\^\([0-9a-f]*\)$|\1|p" /tmp/rel/feeds.buildinfo | head -1)"
            if [ -z "$url" ] || [ -z "$sha" ]; then
              echo "warn: $feed 未出现在 feeds.buildinfo（基准缺失）"
              rows="${rows}| $feed | ? | ? | ? | 基准缺失 |"$'\n'
              continue
            fi
            head_sha="$(git ls-remote "$url" "refs/heads/$BASE_BRANCH" | cut -f1)"
            if [ -z "$head_sha" ]; then
              echo "warn: $feed 的分支 $BASE_BRANCH 解析失败（$url）"
              rows="${rows}| $feed | \`${sha:0:10}\` | ? | ? | 分支 $BASE_BRANCH 解析失败 |"$'\n'
              continue
            fi
            if [ "$head_sha" = "$sha" ]; then
              rows="${rows}| $feed | \`${sha:0:10}\` | 未动 | 0 | — |"$'\n'
              continue
            fi
            drifted=1
            owner_repo="$(printf '%s' "$url" | sed -E 's|^https://github\.com/||; s|\.git$||')"
            # 经 gh 自带的 --jq（不依赖系统 jq，本地/CI 行为一致）
            n="$(gh api "repos/$owner_repo/compare/$sha...$head_sha" --jq '.total_commits | tostring' 2>/dev/null || true)"
            subs="$(gh api "repos/$owner_repo/compare/$sha...$head_sha" \
                    --jq '[.commits[-3:][]? | .commit.message | split("\n")[0]] | join("；")' 2>/dev/null || true)"
            echo "$feed: ${sha:0:10} → ${head_sha:0:10}（提交 +${n:-?}）"
            rows="${rows}| $feed | \`${sha:0:10}\` | \`${head_sha:0:10}\` | +${n:-?} | ${subs:-?} |"$'\n'
          done

          {
            echo "### 基座 feed 漂移（基准：Release \`$tag\`）"
            echo ""
            echo "| feed | 发布时记录 | 当前分支头 | 提交数 | 最近提交 |"
            echo "| :--- | :--- | :--- | :--- | :--- |"
            printf '%s' "$rows"
            echo ""
            echo "策略（TDD §4.2）：基座自带 feeds 保持分支追踪、不加 SHA 锁——本报告只做可见性；"
            echo "构建期以 Gate A 兜底（坑位 #56），复现/二分时用 \`feeds.buildinfo\` 记录的 SHA 临时钉住对应 feed。"
          } > /tmp/drift-report.md
          cat /tmp/drift-report.md >> "$GITHUB_STEP_SUMMARY"

          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "（dry_run）跳过 issue 创建/更新/关闭。"
            exit 0
          fi
          num="$(gh issue list --state open --search 'in:title 基座 feed 漂移' --json number,title \
                  --jq ".[] | select(.title == \"$TITLE\") | .number" 2>/dev/null | head -1)"
          if [ "$drifted" = "1" ]; then
            if [ -n "${num:-}" ]; then
              gh issue edit "$num" --body-file /tmp/drift-report.md
              echo "已更新跟踪 issue #$num"
            else
              gh issue create --title "$TITLE" --body-file /tmp/drift-report.md
              echo "已创建跟踪 issue"
            fi
          elif [ -n "${num:-}" ]; then
            gh issue close "$num" --comment "上游已追平（最近的发布已吸收全部漂移），自动关闭。"
            echo "无漂移，已关闭跟踪 issue #$num"
          else
            echo "无漂移，无需动作。"
          fi
